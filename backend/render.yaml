services:
  - type: web
    name: ace-gaming-backend
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DEV_OTP_ENABLED
        value: "false"
      - key: SOFTAGGREGATOR_ENABLED
        value: "false"
